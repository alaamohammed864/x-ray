name: Build X-Ray Mirror APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  MEDIAPIPE_VERSION: "0.10.14"
  # عدّل هذا المسار ليطابق ما تستدعيه index.html
  VENDOR_DIR: app/src/main/assets/mediapipe
  FACE_MODEL_URL: https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task
  HAND_MODEL_URL: https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download MediaPipe Tasks Vision
        run: |
          mkdir -p "$VENDOR_DIR/wasm" "$VENDOR_DIR/models" /tmp/mp
          cd /tmp/mp
          npm pack "@mediapipe/tasks-vision@${MEDIAPIPE_VERSION}"
          tar -xzf mediapipe-tasks-vision-*.tgz
          cd "$GITHUB_WORKSPACE"
          cp /tmp/mp/package/vision_bundle.mjs "$VENDOR_DIR/"
          cp /tmp/mp/package/wasm/* "$VENDOR_DIR/wasm/"

      - name: Download face and hand models
        run: |
          curl -fL --retry 3 -o "$VENDOR_DIR/models/face_landmarker.task" "$FACE_MODEL_URL"
          curl -fL --retry 3 -o "$VENDOR_DIR/models/hand_landmarker.task" "$HAND_MODEL_URL"

      - name: Verify bundled files
        run: |
          for f in face_landmarker.task hand_landmarker.task; do
            size=$(stat -c%s "$VENDOR_DIR/models/$f")
            echo "$f: $size bytes"
            [ "$size" -gt 1000000 ] || { echo "::error::$f is smaller than 1MB"; exit 1; }
          done
          ls "$VENDOR_DIR"/wasm/*.wasm > /dev/null || { echo "::error::WASM files missing"; exit 1; }
          if grep -rEn "(src|href)=[\"']https?://" app/src/main/assets/index.html; then
            echo "::error::External link found in index.html"; exit 1
          fi
          if grep -rn "android.permission.INTERNET" app/src/main/AndroidManifest.xml; then
            echo "::error::INTERNET permission must not be requested"; exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Verify assets inside APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
          echo "APK: $APK"
          unzip -l "$APK" | grep -q "face_landmarker.task" || { echo "::error::face model not in APK"; exit 1; }
          unzip -l "$APK" | grep -q "hand_landmarker.task" || { echo "::error::hand model not in APK"; exit 1; }
          unzip -l "$APK" | grep -q "\.wasm" || { echo "::error::WASM not in APK"; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XRayMirror-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
